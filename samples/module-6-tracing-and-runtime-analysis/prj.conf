# Note, Zephyr log symbol is selected in Kconfig file by choice of
# L6_APP_ZEPHYR_TRACING.
# CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=1000
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y

CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# TODO [ ] Learn what SHELL_LOG_BACKEND provides and affects
# CONFIG_SHELL_LOG_BACKEND=n

CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
# TODO [ ] Learn what UART_NATIVE_PTY_0_ON_OWN_PTY provides and affects
# CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y

# Note, the nucleo_l432kc breaks out one UART.  We can log and trace, but not
# sensibly on one and the same UART (or other backend), so disable trace for
# logging observations, and disable logging when trace is enabled:

# Note, tracing symbol is selected in Kconfig file by choice of
# L6_APP_ZEPHYR_TRACING.
# CONFIG_TRACING=n
CONFIG_TRACING_CTF=y
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_BACKEND_POSIX=y
CONFIG_TRACING_PACKET_MAX_SIZE=64

CONFIG_L6_APP_ZEPHYR_TRACING=n

CONFIG_MISSED_COUNT_INTERVAL_MS=3000
